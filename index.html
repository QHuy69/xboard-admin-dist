<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZaoGuang Service</title>
    <meta
      name="description"
      content="Admin Dashboard UI built with Shadcn and Vite."
    />
    <script src="/settings.js"></script>
    <script src="/settings.local.js"></script>
    <script>
      (() => {
        const marker = "xboard.admin.language-detection.v1";
        const supported = ["vi-VN", "en-US", "zh-CN", "ru-RU"];
        const detected = (navigator.languages || [navigator.language || "en"])
          .map((language) => String(language).toLowerCase())
          .find((language) => /^(vi|en|zh|ru)(-|$)/.test(language));
        if (!localStorage.getItem(marker)) {
          let language = localStorage.getItem("i18nextLng");
          if (detected && detected.startsWith("vi")) language = "vi-VN";
          else if (!supported.includes(language)) {
            language = detected?.startsWith("zh") ? "zh-CN"
              : detected?.startsWith("ru") ? "ru-RU" : "en-US";
          }
          localStorage.setItem("i18nextLng", language);
          localStorage.setItem(marker, "1");
        }
      })();
    </script>
    <script src="./locales/en-US.js"></script>
    <script src="./locales/vi-VN-v3.js"></script>
    <script src="./locales/zh-CN.js"></script>
    <script src="./locales/ru-RU.js"></script>
    <script type="module" crossorigin src="./assets/index-CEIYH7i8.js?v=vi1"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DiYa-_z_.css">
  </head>

    <div id="root"></div>
  </body>
</html>
